
name: Build FF LISO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip FF_LISO_Android_CloudBuild.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FF-LISO-APK
          path: project/app/build/outputs/apk/debug/*.apk
